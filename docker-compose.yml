version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: always
    container_name: rag_postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_backend
    command: uvicorn app:app --host 0.0.0.0 --port 9002
    ports:
      - "9002:9002"
    depends_on:
      - postgres
    env_file:
      - .env

  redis:
    image: redis:7
    container_name: rag_redis
    ports:
      - "6379:6379"

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_celery
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=4 -Q file_queue
    depends_on:
      - backend
      - postgres
    env_file:
      - .env

volumes:
  postgres_data:
